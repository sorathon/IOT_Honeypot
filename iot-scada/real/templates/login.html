<!DOCTYPE html>
<html>
<head>
    <title>Secure SCADA System</title>
    <style>
        body { background-color: #f0f8ff; font-family: Arial; text-align: center; padding-top: 50px; }
        .box { border: 1px solid #ccc; width: 300px; margin: 0 auto; padding: 30px; background-color: #fff; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h3 { color: #0056b3; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px;}
        button { width: 100%; padding: 10px; background: #0056b3; color: #fff; border: none; cursor: pointer; border-radius: 4px;}
    </style>
</head>
<body>
    <div class="box">
        <h3>✅ SECURE SYSTEM V2</h3>
        <p>Welcome Admin. Please login.</p>
        <form>
            <input type="text" placeholder="Admin ID">
            <input type="password" placeholder="Passcode">
            <button type="button">Secure Login</button>
        </form>
    </div>
</body>
</html>
