<!DOCTYPE html>
<html>
<head>
    <title>SCADA Web Interface (Restricted)</title>
    <style>
        body { background-color: #222; color: #fff; font-family: monospace; text-align: center; padding-top: 50px; }
        .box { border: 2px solid #ff0000; width: 300px; margin: 0 auto; padding: 20px; background-color: #111; }
        .alert { background-color: #ff0000; color: #fff; padding: 5px; font-weight: bold; margin-bottom: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; background: #333; border: 1px solid #555; color: #0f0; }
        button { width: 100%; padding: 10px; background: #ff0000; color: #fff; border: none; cursor: pointer; font-weight: bold;}
    </style>
</head>
<body>
    <div class="box">
        <div class="alert">⚠️ UNAUTHORIZED ACCESS PROHIBITED</div>
        <h3>Modbus ICS Control</h3>
        <form method="POST">
            <input type="text" name="username" placeholder="Operator ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">SYSTEM LOGIN</button>
        </form>
    </div>
</body>
