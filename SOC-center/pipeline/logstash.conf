input {
  beats { 
    port => 5044 
    host => "0.0.0.0"
  }
}

filter {
  # --------------------------------------------------
  # 🎯 บล็อกที่ 1: ดักจับ Log จาก Cowrie (SSH)
  # --------------------------------------------------
  if "cowrie" in [log][file][path] or [fields][event_type] == "cowrie_log" {
    mutate { add_field => { "honeypot_type" => "ssh_cowrie" } }
    mutate { remove_field => [ "[input]" ] }
    
    json {
      source => "message"
      remove_field => ["message"] 
      tag_on_failure => ["_jsonparsefailure_cowrie"]
    }
    
    mutate { rename => { "input" => "attacker_cmd" } }

    # 🛠️ [แก้บั๊กเวลา]
    if [timestamp] {
      mutate { gsub => [ "timestamp", "Z$", "" ] }
      date {
        match => [ "timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSSSS" ]
        timezone => "Asia/Bangkok"
        target => "@timestamp"
      }
    }
    
    ruby {
      code => "event.set('time_bkk', event.get('@timestamp').time.localtime('+07:00').strftime('%Y-%m-%d %H:%M:%S'))"
    }

    # 📍 [แผนที่]
    if [src_ip] and [src_ip] !~ /^(10|127|192\.168|172\.(1[6-9]|2[0-9]|3[0-1]))\./ {
      geoip {
        source => "src_ip"
        target => "geoip"
      }
    }
  }

  # --------------------------------------------------
  # ✨ บล็อกที่ 2: ดักจับ Log จาก OpenCanary (Network)
  # --------------------------------------------------
  else if "opencanary" in [log][file][path] or [fields][event_type] == "opencanary_log" {
    mutate { add_field => { "honeypot_type" => "network_opencanary" } }
    
    json {
      source => "message"
      remove_field => ["message"]
      tag_on_failure => ["_jsonparsefailure_opencanary"]
    }

    if [utc_time] {
      date {
        match => [ "utc_time", "yyyy-MM-dd HH:mm:ss.SSSSSS", "yyyy-MM-dd HH:mm:ss" ]
        timezone => "UTC"
        target => "@timestamp"
      }
    }
    
    ruby {
      code => "event.set('time_bkk', event.get('@timestamp').time.localtime('+07:00').strftime('%Y-%m-%d %H:%M:%S'))"
    }

    # 📍 [แผนที่]
    if [src_host] and [src_host] !~ /^(10|127|192\.168|172\.(1[6-9]|2[0-9]|3[0-1]))\./ {
      geoip {
        source => "src_host"
        target => "geoip"
      }
    }
  }

  # --------------------------------------------------
  # 🏭 บล็อกที่ 3: ดักจับ Log จาก SCADA Fake (Web) [เพิ่มใหม่!]
  # --------------------------------------------------
  else if "scada_fake" in [log][file][path] or [fields][event_type] == "scada_log" {
    mutate { add_field => { "honeypot_type" => "scada_web" } }

    # Parse JSON กรณี Log ของ SCADA เก็บเป็นรูปแบบ JSON
    json {
      source => "message"
      tag_on_failure => ["_jsonparse_scada_failure"]
    }

    # ตั้งเวลาภาษาไทย
    ruby {
      code => "event.set('time_bkk', event.get('@timestamp').time.localtime('+07:00').strftime('%Y-%m-%d %H:%M:%S'))"
    }

    # 📍 [แผนที่] หาพิกัดจาก src_ip (ถ้ามีใน Log)
    if [src_ip] and [src_ip] !~ /^(10|127|192\.168|172\.(1[6-9]|2[0-9]|3[0-1]))\./ {
      geoip {
        source => "src_ip"
        target => "geoip"
      }
    }
  }

  # --------------------------------------------------
  # 🗑️ บล็อกที่ 4: ถ้าไม่เข้าเงื่อนไขไหนเลย
  # --------------------------------------------------
  else {
    mutate { add_field => { "honeypot_type" => "unknown" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "honeypot-%{honeypot_type}-%{+YYYY.MM.dd}"
  }
  
  stdout { codec => rubydebug }
}