{
    "device.node_id": "opencanary-pi",
    "ip.ignorelist": [],
    "devicename": "any",
    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "handlers": {
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/log/opencanary/opencanary.log"
                },
                "console": {
                    "class": "logging.StreamHandler"
                }
            }
        }
    },
    "http.enabled": true,
    "http.port": 8080,
    "ftp.enabled": true,
    "ftp.port": 21,
    "mssql.enabled": true,
    "mssql.port": 1433,
    "portscan.enabled": false
}
