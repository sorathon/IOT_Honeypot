# -----------------------------
# 1. ตรวจว่าเป็น Tailscale ไหม
# -----------------------------
map $remote_addr $is_internal {
    default 0;
    100.64.0.0/10 1;   # Tailscale range
}

# -----------------------------
# 2. เลือก backend
# -----------------------------
map $is_internal $backend {
    1 http://real_site;
    0 http://fake_site;
}

# -----------------------------
# 3. upstream (Docker ports ของคุณ)
# -----------------------------
upstream fake_site {
    server 127.0.0.1:8081;
}

upstream real_site {
    server 127.0.0.1:8082;
}

# -----------------------------
# 4. server
# -----------------------------
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass $backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # timeout กันค้าง
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # -----------------------------
        # DEBUG (สำคัญ)
        # -----------------------------
        add_header X-Debug-IP $remote_addr always;
        add_header X-Debug-Backend $backend always;
    }
}
